/* Concepto: videojuego futurista sobre la foto real del puente y el río Bermejo.
   Paneles de cristal holográfico con borde neón, relieve metálico y luz turquesa, violeta, azul eléctrico y plata.
   Mundo visual único (oscuro): se define por elección, con fondo y colores explícitos. */
:root{
  color-scheme:dark;
  --bg:#060A1C; --ink:#EAF4FF; --muted:#A5B6D8;
  --c1:#19F2D6; /* turquesa  */ --c2:#A66BFF; /* violeta */ --c3:#3D7BFF; /* azul eléctrico */
  --c4:#D7DFEE; /* plata */ --c5:#D58BFF; /* orquídea */ --c6:#4DD2FF; /* celeste */
  --glass:rgba(11,17,46,.58); --glass2:rgba(255,255,255,.07); --surface:rgba(11,17,46,.62); --surface2:rgba(255,255,255,.09);
  --edge:rgba(170,228,255,.5); --on-q:#04102A;
  --ok:#3CFFA6; --ok-bg:rgba(30,255,150,.14); --bad:#FF6B86; --bad-bg:rgba(255,80,110,.15);
  --sun:#E9F2FF; --on-sun:#04102A;
  --q:var(--c1);
  --font-display:'Orbitron','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  --metal:linear-gradient(180deg,#fff 0%,#C9D6EE 38%,#8A99BC 52%,#E8F0FF 100%);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;font-weight:600;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 44px;
}

/* rejilla sutil */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(120,220,255,.05) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,rgba(120,220,255,.04) 0 1px,transparent 1px 46px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%);}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.04em;text-transform:uppercase}
h3{font-size:1.05rem}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:14px;box-shadow:0 0 0 6px var(--c1)}
#app{max-width:860px;margin:0 auto;min-width:0}
.screen{display:flex;flex-direction:column;gap:16px;animation:enter .4s ease both}
.noanim .screen,.noanim *{animation:none!important;transition:none!important}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- cristal holográfico ---------- */
.card{position:relative;min-width:0;padding:18px;border-radius:20px;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 45%,rgba(120,150,255,.06)),var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  border:1.5px solid var(--edge);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 26px color-mix(in srgb,var(--q) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.5);}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,transparent 28%,rgba(120,255,240,.10) 40%,rgba(190,140,255,.14) 50%,rgba(90,160,255,.10) 60%,transparent 72%);}
.btn{
  --b:var(--c4);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 20px;
  font-family:var(--font-display);font-weight:800;font-size:.95rem;letter-spacing:.07em;text-transform:uppercase;text-align:center;color:#fff;
  text-shadow:0 0 10px color-mix(in srgb,var(--b) 80%,transparent),0 1px 0 rgba(0,0,0,.6);
  background:linear-gradient(180deg,color-mix(in srgb,var(--b) 44%,#0B1236) 0%,color-mix(in srgb,var(--b) 14%,#060A1C) 100%);
  border:2px solid var(--b);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.35),0 0 20px color-mix(in srgb,var(--b) 55%,transparent),0 6px 0 color-mix(in srgb,var(--b) 38%,#000),0 12px 22px rgba(0,0,0,.45);
  transition:transform .1s,box-shadow .1s,filter .15s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}

/* ---------- inicio ---------- */

.opt{
  position:relative;display:flex;align-items:center;gap:14px;text-align:left;min-height:72px;padding:10px 14px;color:#fff;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),rgba(9,14,42,.72);

}

.rr .nm{overflow-wrap:anywhere;min-width:0}
.rr .p{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--c1)}

/* ---------- banco ---------- */
.bank{display:flex;flex-direction:column;gap:12px}
details.qb{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid var(--edge);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.4);min-width:0}
details.qb[open]{border-color:var(--q);box-shadow:0 0 22px color-mix(in srgb,var(--q) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
details.qb summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-height:56px}
details.qb summary::-webkit-details-marker{display:none}
details.qb .qt{overflow-wrap:anywhere;font-weight:700}
details.qb .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
details.qb .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:6px}
details.qb ol{list-style:upper-alpha;margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:4px}
details.qb li.right{color:var(--ok);font-weight:800}
details.qb li.right::after{content:" ✔ correcta"}
.d1{--q:var(--c1)}.d2{--q:var(--c3)}.d3{--q:var(--c2)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step{display:flex;flex-direction:column;gap:6px}
.step>*{position:relative;z-index:1}
.step .no{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff -30%,var(--c) 80%);color:var(--on-q);border:2px solid #fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:1.15rem;box-shadow:0 0 18px var(--c)}
.step b{font-family:var(--font-display);font-weight:800;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}
.card>h3,.card>p{position:relative;z-index:1}
.card>p{margin:8px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

/* ---------- confeti / avisos ---------- */
.spark{position:fixed;width:9px;height:14px;border-radius:3px;pointer-events:none;z-index:50;animation:spark .9s ease-out forwards;box-shadow:0 0 10px currentColor}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--metal);color:var(--on-sun);padding:10px 18px;border-radius:999px;font-weight:800;z-index:60;box-shadow:0 0 20px rgba(255,255,255,.5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- salas online ---------- */
.menu .big.wide{grid-column:1/-1}
.roomcard{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.roomcard>*{position:relative;z-index:1}
.roomcard .lbl{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--c1)}
.roomcode{font-family:var(--font-display);font-weight:900;font-size:clamp(2.4rem,14vw,4.4rem);letter-spacing:.16em;padding-left:.16em;line-height:1.1;background:var(--metal);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px var(--c1))}
.linkrow{display:flex;gap:8px;width:100%;align-items:center}
.linkrow input{flex:1;font-size:.85rem;min-height:44px}
.lp{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid var(--edge);border-radius:14px;background:var(--glass);min-width:0}
.lp .num{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--c) 25%,#070C26);box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.lp .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.status{min-height:1.4em;font-weight:700;color:var(--muted)}
.status.err{color:var(--bad)}
input.code{font-family:var(--font-display);font-weight:800;font-size:1.7rem;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding-left:.3em}
.opt.sel{border-color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--q) 35%,transparent),rgba(255,255,255,.04)),rgba(9,14,42,.8);box-shadow:0 0 26px var(--q),inset 0 1px 0 rgba(255,255,255,.5),0 5px 0 rgba(0,0,0,.5)}
.opt.sel .mark{display:inline-flex}
.opt:disabled{cursor:default}

/* ================= CELULARES (hasta 640 px). La versión de computadora no cambia. ================= */
@media (max-width:640px){
  html{-webkit-text-size-adjust:100%}
  body{font-size:16px;padding-block:10px 20px;-webkit-tap-highlight-color:transparent}
  button,.chip,.opt{touch-action:manipulation}
  .screen{gap:12px}
  .card{padding:14px;border-radius:16px}
  .card.qcard{padding:0}
  input[type=text]{font-size:16px}
  /* inicio: todo visible sin desplazarse */
  .hero{padding:12px 0 0}
  .hero p{font-size:1.05rem}
  .logo{margin:12px 0 8px}
  .menu{gap:12px}
  .menu .big{min-height:92px;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:4px 14px;padding:12px 18px;text-align:left}
  .menu .big svg{width:2.2em;height:2.2em}
  .menu .big small{flex-basis:calc(100% - 3.6em);margin-left:auto;margin-top:-4px;text-align:left}
  .menu .row3{gap:10px}
  .menu .row3 .btn{flex-direction:row;min-height:64px;font-size:.66rem;gap:8px;padding:8px 10px}
  .menu .row3 .btn svg{width:1.7em;height:1.7em}
  .online-note{font-size:.82rem}
  /* botones principales fijos abajo para llegar con el pulgar */
  .screen>.btn{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;width:100%;min-height:58px}
  .topbar{gap:10px;flex-wrap:nowrap}
  .topbar .btn.small{min-height:48px;min-width:48px;padding:8px 12px}
  .topbar h2{font-size:1.15rem}
  .chip{min-height:46px}
  .seg .chip{padding:8px 4px;font-size:.95rem}
  .prow .btn.small{min-height:46px;min-width:46px}
  /* partida */
  .hud{gap:8px 10px}
  .hud .qn{font-size:.85rem}
  .qcard .qhead{padding:6px 14px}
  .qcard .qhead span:last-child{display:none}
  .qcard .qtext{font-size:1.2rem;padding:14px 16px 16px}
  .timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;gap:10px;padding:6px 10px;margin-inline:-4px;border-radius:14px;
    background:rgba(5,9,30,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid var(--edge)}
  .timer .bar{height:16px}
  .timer .t{font-size:1.25rem}
  .opts{gap:10px}
  .opt{min-height:64px;padding:8px 12px;gap:12px;font-size:1rem}
  .opt .k{width:42px;height:42px}
  .opt .mark{font-size:.56rem}
  .feedback{gap:10px;padding:14px}
  .feedback .verdict{font-size:1.05rem}
  .pts span{font-size:.72rem;padding:3px 10px}
  .feedback .next{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;flex-wrap:nowrap;gap:10px;padding:8px;border:1.5px solid var(--edge);border-radius:16px;
    background:rgba(5,9,30,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .feedback .next .btn{flex:1;min-height:52px;font-size:.85rem}
  .feedback .next .autobar{flex:0 0 28%;min-width:0}
  .board{max-height:84px;gap:6px}
  .board .b{font-size:.78rem;padding:2px 8px}
  .handoff{padding:26px 14px;gap:12px}
  .handoff .avatar{width:80px;height:80px;font-size:2.3rem}
  .handoff .btn{width:100%}
  .rr{padding:8px 10px;gap:8px;font-size:.95rem}
  .badge{font-size:.54rem;padding:2px 8px}
  /* resultados */
  .result-hero{padding:20px 14px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:12px}
  .stat b{font-size:1.45rem}
  .stat span{font-size:.66rem}
  .vsrow{grid-template-columns:minmax(64px,96px) 1fr auto;gap:8px}
  .actions{grid-template-columns:1fr;gap:12px}
  th,td{padding:9px 10px;font-size:.9rem}
  /* banco, cómo jugar */
  .steps{grid-template-columns:1fr}
  .step{display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center}
  .step .no{grid-row:span 2}
  details.qb summary{padding:12px 14px}
  /* en pantallas táctiles no hay "hover": se evita que quede pegado al tocar */
  @media (hover:none){
    .btn:hover,.opt:hover:not([disabled]){transform:none;filter:none}
    .opt:hover:not([disabled]){border-color:var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.4),0 5px 0 rgba(0,0,0,.5),0 10px 18px rgba(0,0,0,.4)}
  }
}
/* celular horizontal: opciones en 2 columnas y menos altura */
@media (max-height:480px) and (orientation:landscape) and (max-width:960px){
  body{padding-block:6px 12px}
  .opts{grid-template-columns:1fr 1fr}
  .qcard .qtext{font-size:1.05rem;padding:10px 14px}
  .opt{min-height:52px;font-size:.95rem}
  .opt .k{width:36px;height:36px}
  .hero{padding-top:4px}.logo{margin:6px 0}.hero p{font-size:.95rem}
  .menu .big{min-height:76px}.menu .row3{grid-template-columns:repeat(4,1fr)}
  .handoff{padding:14px}.handoff .avatar{width:56px;height:56px;font-size:1.6rem}
  .timer{position:sticky;top:0;z-index:8}
}

<body>
<div id="app"></div>
<script>
/* ===== BANCO DE PREGUNTAS =====
   Para agregar preguntas: sumá una línea Q(...) al final de la lista.
   Q(categoría, dificultad 1-3, pregunta, correcta, [3 incorrectas], explicación)
   Para agregar categorías: sumalas en CATEGORIES. */
const CATEGORIES = {
  F: { name: 'Fundación y Mensura', short: 'Fundación' },
  E: { name: 'Educación', short: 'Educación' },
  I: { name: 'Instituciones y Gobierno', short: 'Instituciones' },
  S: { name: 'Infraestructura y Servicios', short: 'Servicios' },
  A: { name: 'Algodón y Economía', short: 'Algodón' },
  C: { name: 'Cultura y Paseos', short: 'Cultura' }
};
const DIFFS = { 1: 'Fácil', 2: 'Medio', 3: 'Difícil' };
const BANK = [];
function Q(cat, diff, q, right, wrong, exp) {
  const n = BANK.length;
  const pos = (n * 3 + 1) % 4; // posición fija de la correcta (el juego las mezcla al jugar)
  const opts = wrong.slice();
  opts.splice(pos, 0, right);
  BANK.push({ id: String(n + 1).padStart(3, '0'), cat, diff, q, opts, ans: pos, exp });
}

/* --- Fundación y Mensura --- */
Q('F',1,'¿Qué nombre recibió la colonia mensurada en 1935?','Colonia "El Colorado"',['Colonia "Bermejo"','Colonia "Libertad"','Colonia "Pabellón Argentino"'],'En 1935 el agrimensor Oscar Gigena Centeno inició la mensura y bautizó formalmente a la colonia como "El Colorado".');
Q('F',1,'¿Por qué la colonia se llamó "El Colorado"?','Por la tonalidad de las aguas del río Bermejo',['Por el color de la primera escuela','Por el apellido de un antiguo poblador','Por el color de las flores del lapacho'],'El nombre alude a la tonalidad de las aguas del río Bermejo.');
Q('F',2,'¿Quién inició los trabajos de mensura de la colonia en 1935?','Oscar Gigena Centeno',['Nicasio Uliambre','Pedro Barraza','Félix Luis Navarro'],'El agrimensor Oscar Gigena Centeno inició la mensura en 1935.');
Q('F',2,'¿Qué hecho se considera la fundación de facto de El Colorado?','La creación de la Subcomisaría "Bermejo"',['La inauguración del Puente "Libertad"','La creación de la Escuela N.º 116','La mensura de la colonia en 1935'],'La creación de la Subcomisaría "Bermejo", el 11 de febrero de 1936, se considera la fundación de facto.');
Q('F',2,'¿En qué fecha se creó la Subcomisaría "Bermejo"?','11 de febrero de 1936',['8 de febrero de 1958','1º de junio de 1936','28 de mayo de 1944'],'La Subcomisaría "Bermejo" se creó el 11 de febrero de 1936.');
Q('F',3,'¿Quién estuvo a cargo de la Subcomisaría "Bermejo" cuando se creó?','El Sargento Pedro Barraza',['Don Silvio Alderete','Don Mario Marino Giroldi','Juan Ramírez'],'La Subcomisaría quedó a cargo del Sargento Pedro Barraza.');
Q('F',2,'¿Cómo se registró el pueblo en los planos oficiales tras el trazado urbano de 1942?','"Pueblo El Colorado"',['"Villa Bermejo"','"Colonia Libertad"','"Ciudad El Colorado"'],'En 1942 Gigena Centeno realizó el trazado urbano y lo registró como "Pueblo El Colorado".');
Q('F',2,'¿Quién realizó la mensura y el trazado urbano del pueblo en 1942?','Oscar Gigena Centeno',['Dr. Luis María Drago','Demetrio Ramírez','Pedro Castagné'],'Gigena Centeno hizo la mensura de la colonia (1935) y el trazado urbano del pueblo (1942).');
Q('F',2,'¿Quién implementó el primer servicio regular de "sirga-balsa" sobre el río Bermejo?','Don Nicasio Uliambre',['Don Mario Marino Giroldi','Don Silvio Alderete','Don Félix Luis Navarro'],'Don Nicasio Uliambre lo implementó entre 1934 y 1935.');
Q('F',1,'¿Qué era la "sirga-balsa"?','Una balsa a cordel para cruzar el río',['Un tren de carga','Un tipo de molino algodonero','Un puente colgante'],'La sirga-balsa era una balsa a cordel para el cruce del río Bermejo.');
Q('F',2,'¿Cuál de estos hechos ocurrió primero?','El servicio de sirga-balsa (1934-1935)',['La inauguración del Puente "Libertad"','La apertura del Hospital Provincial','La inauguración de la Biblioteca Popular'],'La sirga-balsa data de 1934-1935; los otros hechos son posteriores.');
Q('F',3,'¿Cuál de estos hechos ocurrió más recientemente?','La habilitación del Paseo Costanero (2013)',['La inauguración de la Biblioteca Popular (1998)','La fundación de la Cooperativa de Servicios Públicos (1963)','La apertura del Hospital Provincial (1962)'],'El Paseo Costanero se habilitó el 15 de marzo de 2013.');

/* --- Educación --- */
Q('E',2,'¿Qué número tuvo la Escuela Nacional creada en 1936?','N.º 116',['N.º 166','N.º 13','N.º 1'],'El Consejo Nacional de Educación creó la Escuela Nacional N.º 116 el 1º de junio de 1936.');
Q('E',1,'¿Qué organismo dispuso la creación de la Escuela Nacional N.º 116?','El Consejo Nacional de Educación',['La Junta Nacional del Algodón','El INTA','La Comisión de Fomento'],'Fue el Consejo Nacional de Educación, el 1º de junio de 1936.');
Q('E',2,'¿En qué año se creó la Escuela Nacional N.º 116?','1936',['1940','1947','1955'],'Se creó el 1º de junio de 1936.');
Q('E',3,'¿Qué nombre llevó después la Escuela N.º 116?','N.º 166 "Dr. Luis María Drago"',['N.º 1 "Regimiento de Granaderos a Caballo"','N.º 13 "Pedro Castagné"','N.º 116 "Puente Libertad"'],'Con el edificio de material pasó a ser la Escuela N.º 166 "Dr. Luis María Drago".');
Q('E',3,'¿En qué año se inauguró el edificio de material de la Escuela N.º 116?','1947',['1936','1951','1962'],'En 1947 se inauguró el edificio de material y se celebró la Primera Fiesta del Algodón.');
Q('E',2,'¿Cuál fue el primer centro de educación secundaria de la provincia?','E.P.E.S. N.º 1 "Regimiento de Granaderos a Caballo"',['J.I.N. N.º 13','Escuela N.º 116','Escuela N.º 166 "Dr. Luis María Drago"'],'La E.P.E.S. N.º 1 fue el primer centro de educación secundaria de la provincia.');
Q('E',2,'¿En qué año se creó la E.P.E.S. N.º 1 "Regimiento de Granaderos a Caballo"?','1960',['1958','1962','1955'],'Se creó el 25 de abril de 1960.');
Q('E',3,'¿Qué significan las siglas J.I.N.?','Jardín de Infantes Nucleados',['Jardín Infantil Nacional','Junta de Instituciones Nacionales','Jardín Integral Normal'],'El J.I.N. N.º 13 es el Jardín de Infantes Nucleados N.º 13.');
Q('E',2,'¿En qué año inició sus actividades el Jardín de Infantes Nucleados N.º 13?','1997',['1960','1947','2013'],'Su creación se dispuso en 1996 y las actividades comenzaron el 19 de mayo de 1997.');

/* --- Instituciones y Gobierno --- */
Q('I',1,'¿Cuál fue la primera institución deportiva del casco urbano?','Club Sportivo 9 de Julio',['Club Pabellón Argentino','Club Sportivo Libertad','Club Bermejo'],'El Club Sportivo 9 de Julio se constituyó en 1940.');
Q('I',2,'¿En qué año se constituyó el Club Sportivo 9 de Julio?','1940',['1952','1936','1947'],'Se constituyó en 1940.');
Q('I',2,'¿En qué fecha se redactó el acta de fundación del Club Pabellón Argentino?','20 de octubre de 1952',['28 de octubre de 1963','4 de septiembre de 1998','15 de marzo de 2013'],'El acta de fundación se redactó el 20 de octubre de 1952.');
Q('I',1,'¿A qué jerarquía fue elevada la capilla del pueblo en 1955?','Parroquia San Antonio de Padua',['Catedral','Basílica','Santuario'],'En 1955 la capilla pasó a ser la Parroquia San Antonio de Padua.');
Q('I',2,'¿Quién fue el primer Juez de Paz titular y Jefe del Registro Civil?','Don Félix Luis Navarro',['Don Nicasio Uliambre','Don Silvio Alderete','Juan Ramírez'],'Don Félix Luis Navarro llegó a la localidad el 28 de mayo de 1944.');
Q('I',3,'¿En qué fecha arribó a la localidad Félix Luis Navarro?','28 de mayo de 1944',['1º de junio de 1944','11 de febrero de 1936','1º de mayo de 1937'],'Arribó el 28 de mayo de 1944; las oficinas se inauguraron el 1º de junio.');
Q('I',2,'¿Qué se inauguró oficialmente el 1º de junio de 1944?','Las oficinas del Juzgado de Paz y del Registro Civil',['La Estafeta Postal','El Hospital Provincial','La Usina Eléctrica'],'Se inauguraron las oficinas del Juzgado de Paz y del Registro Civil.');
Q('I',2,'En 1957, ¿a qué rango fue elevada la Comisión de Fomento?','Municipalidad',['Departamento','Provincia','Cooperativa'],'Pasó a ser Municipalidad en 1957.');
Q('I',2,'¿Quién fue el primer intendente de la Municipalidad?','Juan Ramírez',['Nicasio Uliambre','Silvio Alderete','Félix Luis Navarro'],'Juan Ramírez asumió como primer intendente en 1957.');
Q('I',2,'¿Cómo se llama la entidad fundada el 28 de octubre de 1963?','Cooperativa de Servicios Públicos "El Colorado" Ltda.',['Cooperativa Algodonera "El Colorado"','Usina Popular "Bermejo"','Club Pabellón Argentino'],'Es la Cooperativa de Servicios Públicos "El Colorado" Ltda.');
Q('I',2,'¿En qué año se fundó la Cooperativa de Servicios Públicos?','1963',['1951','1958','1996'],'Se fundó el 28 de octubre de 1963.');

/* --- Infraestructura y Servicios --- */
Q('S',1,'El Puente "Libertad" une Formosa con otra provincia. ¿Cuál?','Chaco',['Santa Fe','Corrientes','Salta'],'El Puente "Libertad" vincula de manera permanente a Formosa con el Chaco.');
Q('S',2,'¿Sobre qué río se construyó el Puente "Libertad"?','Bermejo',['Pilcomayo','Paraná','Paraguay'],'El puente cruza el río Bermejo.');
Q('S',2,'¿En qué fecha se inauguró oficialmente el Puente "Libertad"?','8 de febrero de 1958',['11 de febrero de 1936','20 de octubre de 1952','28 de octubre de 1963'],'Se inauguró el 8 de febrero de 1958.');
Q('S',2,'¿Quién atendió al comienzo la primera Estafeta Postal, en 1940?','Silvio Alderete',['Pedro Barraza','Félix Luis Navarro','Juan Ramírez'],'La Estafeta Postal funcionó desde enero de 1940, atendida por Silvio Alderete.');
Q('S',3,'¿En qué calle se construyó el edificio propio de Correos y Telégrafos en 1951?','Hipólito Yrigoyen',['Santa Fe','Demetrio Ramírez','Pedro Castagné'],'Quedó inaugurado el 21 de abril de 1951 en la calle Hipólito Yrigoyen.');
Q('S',3,'¿En qué calle abrió sus puertas el Hospital Provincial de El Colorado?','Santa Fe',['Hipólito Yrigoyen','Demetrio Ramírez','Libertad'],'El Hospital Provincial abrió en 1962 en la calle Santa Fe.');
Q('S',2,'¿En qué año abrió el Hospital Provincial de El Colorado?','1962',['1948','1958','1963'],'Abrió sus puertas en 1962.');
Q('S',2,'¿Qué edificó la Comisión de Fomento en 1948?','El galpón de la Usina Eléctrica',['El Puente "Libertad"','El Hospital Provincial','La Biblioteca Popular'],'En 1948 edificó el galpón destinado a la Usina Eléctrica local.');
Q('S',1,'¿Qué fundó Don Mario Marino Giroldi en 1937?','La primera empresa de transporte colectivo de pasajeros',['El primer periódico','El primer club deportivo','La primera cooperativa'],'Fue la primera empresa de transporte colectivo de pasajeros de la región (1º de mayo de 1937).');
Q('S',3,'¿En qué año fundó Giroldi la primera empresa de transporte colectivo de pasajeros?','1937',['1939','1942','1952'],'Fue el 1º de mayo de 1937.');
Q('S',1,'¿Qué servicio regular permitió cruzar el río Bermejo en 1934-1935?','La sirga-balsa',['El Puente "Libertad"','Un servicio de lanchas a motor','El ferrocarril'],'El puente llegó recién en 1958; antes funcionó la sirga-balsa de Don Nicasio Uliambre.');

/* --- Algodón y Economía --- */
Q('A',1,'¿Qué cultivo impulsó el desarrollo económico de El Colorado desde 1939?','El algodón',['La soja','La caña de azúcar','La yerba mate'],'La Junta Nacional del Algodón impulsó el desarrollo agrícola y económico del asentamiento.');
Q('A',2,'¿Qué creó la Junta Nacional del Algodón en 1939?','La Chacra Experimental y la Desmotadora Oficial',['El Hospital y la Escuela','La Biblioteca Popular','El Paseo Costanero'],'Creó la Chacra Experimental e instaló la Desmotadora Oficial.');

/* ---------- sonido ---------- */
let ac;
function tone(f, d = .12, t = 0, type = 'sine', v = .12) {
  if (!settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + t;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch (e) {}
}
const sfx = {
  ok() { [523, 659, 784].forEach((f, i) => tone(f, .16, i * .09, 'triangle')); },
  bad() { tone(196, .25, 0, 'sawtooth', .08); tone(147, .3, .14, 'sawtooth', .08); },
  tick() { tone(880, .05, 0, 'square', .04); },
  end() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, i * .13, 'triangle')); },
  click() { tone(660, .05, 0, 'triangle', .05); }
};

/* ---------- lógica de partida ---------- */
const BOT_P = { 1: .85, 2: .65, 3: .45 };

function newSession(mode, names) {
  const p = pool(), n = Math.min(settings.count, p.length);
  const qs = shuffle(p).slice(0, n).map(b => { // sin repetir; opciones en orden aleatorio
    const order = shuffle([0, 1, 2, 3]);
    return { b, opts: order.map(i => b.opts[i]), right: order.indexOf(b.ans) };
  });
  const mk = (id, name, extra) => Object.assign({ id, name, score: 0, correct: 0, wrong: 0, none: 0, ms: 0 }, extra);
  const players = mode === 'solo' ? [mk(0, names[0]), mk(1, 'Sistema', { bot: true })] : names.map((nm, i) => mk(i, nm));
  S.sess = { mode, players, qs, i: 0, turn: 0, limit: settings.time, round: {}, locked: false, log: [], t0: Date.now(), saved: false };
  nextQuestion(true);
}

function nextQuestion(first) {
  const s = S.sess;
  if (!first) s.i++;
  if (s.i >= s.qs.length) return finish();
  s.round = {}; s.turn = 0;
  if (s.mode === 'solo') {
    const d = s.qs[s.i].b.diff;
    s.bot = { ok: Math.random() < BOT_P[d], ms: rand(4000, s.limit * 1000 * .75) };
    showQuestion();
  } else showHandoff();
}

const boardHTML = (s, activeId) => `<div class="board" aria-label="Marcador">${s.players.map(p =>
  `<span class="b ${p.id === activeId ? 'me' : ''} ${s.round[p.id] ? 'done' : ''}">${esc(p.name)}: <em>${p.score}</em> puntos</span>`).join('')}</div>`;

const progressHTML = s => `<div class="progress" role="img" aria-label="Pregunta ${s.i + 1} de ${s.qs.length}">${s.qs.map((_, k) => `<i class="${k < s.i ? 'done' : k === s.i ? 'now' : ''}"></i>`).join('')}</div>`;

function showHandoff() {
  const s = S.sess, p = s.players[s.turn], acc = ACC[s.i % 6];
  S.view = 'handoff';
  render(`
    <div class="hud"><div class="meta"><span class="qn">Pregunta ${s.i + 1} de ${s.qs.length}</span></div>${progressHTML(s)}</div>
    ${boardHTML(s, p.id)}
    <div class="card handoff">
      <span class="avatar" aria-hidden="true">${esc([...p.name][0] || '?').toUpperCase()}</span>
      <span class="muted">Pasá el dispositivo a</span>
      <div class="who">${esc(p.name)}</div>
      <span class="note">Turno ${s.turn + 1} de ${s.players.length}. Que nadie más mire la pantalla.</span>
      <button class="btn cy" data-act="ready">${ic('play')}Estoy listo</button>
    </div>`, '', `--q:${acc}`);
}

function showQuestion() {
  const s = S.sess, q = s.qs[s.i], p = s.players[s.turn], solo = s.mode === 'solo', acc = ACC[s.i % 6];
  S.view = 'q'; s.locked = false;
  const me = s.players[0], bot = s.players[1];
  render(`
    <div class="hud">
      <div class="meta"><span class="qn">Pregunta ${s.i + 1} de ${s.qs.length}</span>
        <span class="pill">${CATEGORIES[q.b.cat].short}</span><span class="pill plain">${DIFFS[q.b.diff]}</span></div>
      ${solo ? `<div class="scorebox"><div class="score"><b id="sc0">${me.score}</b><small>Vos</small></div>
        <div class="score bot"><b id="sc1">${bot.score}</b><small>${ic('bot')} Sistema</small></div></div>` : ''}
      ${progressHTML(s)}
    </div>
    ${solo ? '' : boardHTML(s, p.id)}
    <div class="timer" id="timer" role="timer" aria-label="Tiempo restante"><div class="bar"><div class="fill" id="fill"></div></div><div class="t">${ic('clock')}<span id="tl">${s.limit}</span></div></div>
    <div class="card qcard">
      <div class="qhead"><span>${CATEGORIES[q.b.cat].name}</span><span>${solo ? 'Acertá y sumá 100 + bonus' : 'Turno de ' + esc(p.name)}</span></div>
      <div class="qtext" id="qtext">${esc(q.b.q)}</div>
    </div>
    <div class="opts" id="opts" role="group" aria-labelledby="qtext">${q.opts.map((o, i) => `
      <button class="opt" data-act="pick" data-i="${i}"><span class="k">${LET[i]}</span><span class="tx">${esc(o)}</span>
      <span class="mark">${ic('check')}<span class="mt"></span></span></button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div>`, '', `--q:${acc}`);
  startTimer();
}

function startTimer() {
  const s = S.sess; s.tStart = Date.now(); let lastTick = s.limit;
  S.iv = setInterval(() => {
    const left = Math.max(0, s.limit - (Date.now() - s.tStart) / 1000);
    const fill = $('#fill'), tl = $('#tl'), t = $('#timer');
    if (fill) fill.style.transform = `scaleX(${left / s.limit})`;
    const secs = Math.ceil(left);
    if (tl) tl.textContent = secs;
    if (t) t.classList.toggle('low', left <= 8);
    if (secs <= 5 && secs < lastTick && secs > 0) sfx.tick();
    lastTick = secs;
    if (left <= 0) pick(null);
  }, 100);
}

function pick(i) {
  const s = S.sess;
  if (!s || s.locked || S.view !== 'q') return; // una pregunta no puede responderse dos veces
  s.locked = true; clearInterval(S.iv);
  const q = s.qs[s.i], p = s.players[s.turn];
  const ms = Math.min(s.limit * 1000, Date.now() - s.tStart);
  const rem = Math.max(0, s.limit - ms / 1000);
  const timeout = i === null, ok = !timeout && i === q.right;
  const bonus = ok ? Math.round(50 * rem / s.limit) : 0, pts = ok ? 100 + bonus : 0;
  p.score += pts; p.ms += ms;
  if (ok) p.correct++; else { p.wrong++; if (timeout) p.none++; }
  s.round[p.id] = { choice: i, ok, timeout, pts, bonus, ms };
  s.log.push({ q: q.b.id, player: p.id, choice: i === null ? null : q.b.opts.indexOf(q.opts[i]), ok, pts, ms });
  if (s.mode === 'solo') return revealSolo(i, ok, timeout, pts, bonus);
  sfx.click();
  s.turn++;
  s.turn < s.players.length ? showHandoff() : showRoundResult();
}

function revealSolo(i, ok, timeout, pts, bonus) {
  const s = S.sess, q = s.qs[s.i], me = s.players[0], bot = s.players[1];
  document.querySelectorAll('.opt').forEach((b, k) => {
    b.disabled = true;
    if (k === q.right) { b.classList.add('ok'); b.querySelector('.mt').textContent = 'Correcta'; }
    else if (k === i) { b.classList.add('bad'); b.querySelector('.mark svg').innerHTML = P.x; b.querySelector('.mt').textContent = 'Incorrecta'; }
    else b.classList.add('dim');
  });
  // el Sistema "responde" a su ritmo y se revela junto con vos
  let botTxt;
  if (s.bot.ok) { const bb = Math.round(50 * Math.max(0, s.limit - s.bot.ms / 1000) / s.limit); bot.score += 100 + bb; bot.correct++; botTxt = `Sistema: acertó +${100 + bb}`; }
  else { bot.wrong++; botTxt = 'Sistema: falló'; }
  $('#sc0').textContent = me.score; $('#sc1').textContent = bot.score;
  const last = s.i + 1 >= s.qs.length;
  const verdict = ok ? `${ic('check')}¡CORRECTO!` : timeout ? `${ic('clock')}¡SE ACABÓ EL TIEMPO!` : `${ic('x')}INCORRECTA`;
  $('#fb').innerHTML = `<div class="card feedback ${ok ? 'ok' : 'bad'}">
    <div class="verdict">${verdict}</div>
    ${ok ? `<div class="pts"><span>¡Correcto! +100</span><span>Bonus de velocidad +${bonus}</span><span class="tot">Total +${pts}</span></div>`
         : `<p><b>La respuesta correcta era ${LET[q.right]}: ${esc(q.opts[q.right])}</b></p>`}
    <p>${esc(q.b.exp)}</p>
    <p class="note" style="color:var(--muted)">${botTxt}</p>
    <div class="next"><button class="btn small ${ok ? 'cy' : 'vi'}" data-act="next" id="nextbtn">${last ? 'Ver resultado' : 'Siguiente'}${ic('next')}</button>
    <div class="autobar" aria-hidden="true"><i id="auto"></i></div></div></div>`;
  $('#fb').scrollIntoView({ block: 'nearest', behavior: settings.anim ? 'smooth' : 'auto' });
  const auto = $('#auto');
  if (auto) { auto.style.transition = 'transform 7s linear'; requestAnimationFrame(() => requestAnimationFrame(() => { auto.style.transform = 'scaleX(0)'; })); }
  S.to = setTimeout(() => nextQuestion(), 7000);
  if (ok) { sfx.ok(); burst($('.opt.ok')); } else sfx.bad();
}

function showRoundResult() {
  const s = S.sess, q = s.qs[s.i], last = s.i + 1 >= s.qs.length;
  S.view = 'round';
  const rows = s.players.map(p => {
    const r = s.round[p.id];
    const b = r.ok ? `<span class="badge ok">${ic('check')}Correcta</span>` : r.timeout ? `<span class="badge bad">${ic('clock')}Sin responder</span>` : `<span class="badge bad">${ic('x')}Incorrecta</span>`;
    return `<div class="rr"><span class="nm"><b>${esc(p.name)}</b></span>${b}<span class="p">+${r.pts}</span></div>`;
  }).join('');
  render(`
    <div class="hud"><div class="meta"><span class="qn">Resultado de la ronda ${s.i + 1} de ${s.qs.length}</span></div>${progressHTML(s)}</div>
    ${boardHTML(s, -1)}
    <div class="card qcard"><div class="qhead"><span>${CATEGORIES[q.b.cat].name}</span><span>${DIFFS[q.b.diff]}</span></div>
      <div class="qtext">${esc(q.b.q)}</div></div>
    <div class="card feedback ok"><div class="verdict">${ic('check')}Respuesta correcta: ${LET[q.right]}</div>
      <p><b>${esc(q.opts[q.right])}</b></p><p>${esc(q.b.exp)}</p></div>
    <div class="round-rows">${rows}</div>
    <button class="btn cy" data-act="next">${last ? 'Ver resultado final' : 'Siguiente pregunta'}${ic('next')}</button>`,
    '', `--q:${ACC[s.i % 6]}`);
  const anyOk = s.players.some(p => s.round[p.id].ok);
  anyOk ? sfx.ok() : sfx.bad();
}

/* ---------- récords ---------- */
function saveRecords(entries, key) {
  const all = store.get(key, []).concat(entries).sort((a, b) => b.score - a.score || b.correct - a.correct).slice(0, 50);
  store.set(key, all);
}

function finish() {
  const s = S.sess; S.view = 'final'; sfx.end();
  const n = s.qs.length, date = new Date().toISOString();
  const key = 'ci_rec_' + s.mode;
  const prevBest = Math.max(0, ...store.get(key, []).map(r => r.score));
  if (!s.saved) {
    s.saved = true;
    saveRecords(s.players.filter(p => !p.bot).map(p => ({ name: p.name, score: p.score, correct: p.correct, total: n, date })), key);
  }
  if (s.mode === 'solo') return finalSolo(n, prevBest);
  finalMulti(n);
}

function finalSolo(n, prevBest) {
  const s = S.sess, me = s.players[0], bot = s.players[1];
  const pct = n ? Math.round(me.correct * 100 / n) : 0, wrong = n - me.correct;
  const secs = Math.round(me.ms / 1000), tm = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  const msg = pct >= 90 ? '¡Sabés todo de El Colorado!' : pct >= 70 ? '¡Muy bien! Conocés la historia del pueblo.' : pct >= 40 ? 'Vas por buen camino. ¡Probá de nuevo!' : 'Hay que repasar un poco. ¡Revancha!';
  const vs = me.score > bot.score ? '¡Le ganaste al Sistema!' : me.score < bot.score ? 'El Sistema ganó esta vez.' : '¡EMPATE con el Sistema!';
  const rec = me.score > 0 && me.score > prevBest ? `<span class="pill sun">${ic('star')}¡Nuevo récord!</span>` : '';
  const mx = Math.max(me.score, bot.score, 1);
  render(`
    <div class="card result-hero"><h2>RESULTADO FINAL</h2>${rec}
      <div class="big">${me.score}</div><div>puntos</div><div class="msg">${msg}</div></div>
    <div class="stats">
      <div class="card stat good"><b>${me.correct}/${n}</b><span>Correctas</span></div>
      <div class="card stat badc"><b>${wrong}/${n}</b><span>Incorrectas${me.none ? ` (${me.none} sin responder)` : ''}</span></div>
      <div class="card stat"><b>${pct}%</b><span>Aciertos</span></div>
      <div class="card stat"><b>${tm}</b><span>Tiempo utilizado</span></div></div>
    <div class="card vs"><h3>${vs}</h3>
      <div class="vsrow"><span class="nm">${esc(me.name)}</span><span class="tr"><i style="width:${me.score / mx * 100}%;--c:var(--c1)"></i></span><span class="pt">${me.score}</span></div>
      <div class="vsrow"><span class="nm">Sistema</span><span class="tr"><i style="width:${bot.score / mx * 100}%;--c:var(--c2)"></i></span><span class="pt">${bot.score}</span></div></div>
    <div class="actions">
      <button class="btn cy" data-act="again">${ic('repeat')}Jugar de nuevo</button>
      <button class="btn vi" data-act="switchmode">${ic('swap')}Cambiar modo</button>
      <button class="btn" data-act="go" data-to="home">${ic('home')}Volver al inicio</button></div>`, '', '--q:var(--c1)');
  if (me.score > bot.score) burst($('.big'), 30);
}

function finalMulti(n, players, online) {
  const s = { players: players || S.sess.players }, top = Math.max(...s.players.map(p => p.score));
  const leaders = s.players.filter(p => p.score === top);
  const tie = leaders.length > 1;
  const sorted = s.players.slice().sort((a, b) => b.score - a.score || b.correct - a.correct);
  const second = sorted.find(p => p.score < top);
  const head = tie ? '¡EMPATE!' : `¡GANÓ ${esc(leaders[0].name.toUpperCase())}!`;
  const sub = tie ? `Empatan con ${top} puntos: ${leaders.map(p => esc(p.name)).join(', ')}` : `${top} puntos${second ? ` · ${top - second.score} de ventaja` : ''}`;
  const colors = id => ACC[id % 6];
  const rows = sorted.map(p => {
    const lead = p.score === top;
    return `<tr class="${lead ? 'winner' : ''}"><td><b>${esc(p.name)}</b> ${lead ? `<span class="badge w">${tie ? 'Empate' : 'Ganador'}</span>` : ''}</td>
      <td class="n"><b>${p.score}</b></td><td class="n">${p.correct}</td><td class="n">${n - p.correct}</td><td class="n">${lead ? '—' : '−' + (top - p.score)}</td></tr>`;
  }).join('');
  const bars = sorted.map(p => `<div class="vsrow"><span class="nm">${esc(p.name)}</span><span class="tr"><i style="width:${top ? p.score / top * 100 : 0}%;--c:${colors(p.id)}"></i></span><span class="pt">${p.score}</span></div>`).join('');
  render(`
    <div class="card result-hero"><span class="pill sun">${ic('trophy')}Resultado de la partida</span><h2>${head}</h2><div class="msg">${sub}</div></div>
    <div class="tablewrap"><table><thead><tr><th>Jugador</th><th class="n">Puntos</th><th class="n">Correctas</th><th class="n">Incorrectas</th><th class="n">Diferencia</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card vs"><h3>Comparación</h3>${bars}</div>
    ${online ? `<div class="actions">
      ${O && O.role === 'host' ? `<button class="btn cy" data-act="lagain">${ic('repeat')}Volver a la sala</button>` : `<div class="note" style="align-self:center">Esperá a que el anfitrión arme otra partida.</div>`}
      <button class="btn" data-act="go" data-to="home">${ic('home')}Salir al inicio</button></div>` : `<div class="actions">
      <button class="btn cy" data-act="again">${ic('repeat')}Jugar otra vez</button>
      <button class="btn vi" data-act="switchmode">${ic('swap')}Cambiar modo</button>
      <button class="btn" data-act="go" data-to="home">${ic('home')}Volver al inicio</button></div>`}`, '', '--q:var(--c2)');
  burst($('.result-hero h2'), 30);
}

/* ---------- SALAS ONLINE ----------
   Cada jugador usa su propio dispositivo. El anfitrión crea la sala (código de 5 caracteres) y los demás entran
   con el código o con un enlace. Los mensajes viajan por un relé MQTT sobre WebSocket seguro (servidores públicos
   gratuitos). El anfitrión se conecta a TODOS los servidores disponibles y cada jugador prueba todos también,
   así se encuentran aunque alguno esté caído. No hace falta abrir puertos ni que los dispositivos se vean entre sí.
   El anfitrión es la autoridad: elige las preguntas, mide el tiempo, puntúa y reparte los resultados.
   Los demás dispositivos no reciben la respuesta correcta antes de la revelación. */
const MQTT_LIB_URLS = ['https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js', 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'];
const BROKERS = ['wss://mqtt.eclipseprojects.io:443/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const TOPIC_ROOT = 'colorado-inteligente/v1/';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const REVEAL_SECS = 9;
const HB_MS = window.__HB_MS || 4000;     // latido
const DEAD_MS = window.__DEAD_MS || 16000; // sin señales: se considera desconectado
let O = null; // sala actual (null si no hay)

const genCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const newUid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const roomLink = code => location.href.split('#')[0] + '#sala-' + code;
const pub = ps => ps.map(p => ({ id: p.id, name: p.name, alive: p.alive, score: p.score }));
const cfgNow = () => ({ cats: settings.cats.slice(), diff: settings.diff, count: Math.min(settings.count, pool().length), time: settings.time });
const setStatus = (t, err) => { const e = $('#status'); if (e) { e.textContent = t; e.className = 'status' + (err ? ' err' : ''); } const b = $('#netbtn'); if (b) b.disabled = !err && !!t; };
const NETFAIL = 'No se pudo conectar con los servidores de salas. Revisá tu conexión a internet (o probá con otra red) e intentá de nuevo.';
const jparse = b => { try { return JSON.parse(typeof b === 'string' ? b : new TextDecoder().decode(b)); } catch (e) { return null; } };

function loadMqttLib() {
  return new Promise((res, rej) => {
    if (window.mqtt) return res();
    let k = 0;
    const next = () => {
      if (k >= MQTT_LIB_URLS.length) return rej(new Error('lib'));
      const s = document.createElement('script'); s.src = MQTT_LIB_URLS[k++];
      s.onload = () => (window.mqtt ? res() : next()); s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
/* Una conexión a un servidor. Al reconectar se vuelve a suscribir sola. */
function connectLink(url) {
  return new Promise(res => {
    let c, done = false;
    const fin = v => { if (done) return; done = true; clearTimeout(t); res(v); };
    const t = setTimeout(() => { try { c && c.end(true); } catch (e) {} fin(null); }, 8000);
    try { c = mqtt.connect(url, { clientId: 'ci-' + Math.random().toString(16).slice(2, 10), clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 7000 }); } catch (e) { return fin(null); }
    const L = { url, c, subs: [], handlers: [] };
    c.on('connect', () => { L.subs.forEach(s => c.subscribe(s, { qos: 1 })); fin(L); });
    c.on('error', () => {});
    c.on('message', (topic, payload) => { const m = jparse(payload); L.handlers.slice().forEach(h => h(topic, m)); });
  });
}
const linkSub = (L, topic) => { if (!L.subs.includes(topic)) L.subs.push(topic); try { L.c.subscribe(topic, { qos: 1 }); } catch (e) {} };
const linkPub = (L, topic, obj, opts) => { try { L.c.publish(topic, typeof obj === 'string' ? obj : JSON.stringify(obj), Object.assign({ qos: 1 }, opts)); } catch (e) {} };
const linkEnd = L => { try { L.c.end(true); } catch (e) {} };
/* Abre todos los servidores a la vez. Sigue cuando conectó el primero y pasaron 2 s (o ya respondieron todos). */
async function connectAll(onLink) {
  const links = [];
  await new Promise(resolve => {
    let pending = BROKERS.length, first = false, closed = false;
    BROKERS.forEach(u => connectLink(u).then(L => {
      if (L) { links.push(L); onLink && onLink(L); if (!first) { first = true; setTimeout(() => { closed = true; resolve(); }, 2000); } }
      if (--pending === 0) resolve();
    }));
  });
  return links;
}

function buildQs(n) {
  return shuffle(pool()).slice(0, n).map(b => {
    const order = shuffle([0, 1, 2, 3]);
    return { b, opts: order.map(i => b.opts[i]), right: order.indexOf(b.ans) };
  });
}

/* ===== ANFITRIÓN ===== */
async function createRoom(name) {
  if (O || S.busy) return; S.busy = true;
  try {
    setStatus('Conectando con los servidores…');
    try { await loadMqttLib(); } catch (e) { return setStatus(NETFAIL, true); }
    let ready = false, attach = () => {};
    const links = await connectAll(L => { if (ready) attach(L); });
    if (!links.length) return setStatus(NETFAIL, true);
    setStatus('Creando la sala…');
    let code = null;
    for (let k = 0; k < 5 && !code; k++) {
      const c = genCode();
      if (!(await roomExists(links, c))) code = c;
    }
    if (!code) { links.forEach(linkEnd); return setStatus('No se pudo crear la sala. Intentá de nuevo.', true); }
    const base = TOPIC_ROOT + code;
    const R = { players: [{ id: 0, name, alive: true, score: 0, correct: 0, wrong: 0, none: 0 }], nextId: 1, started: false, phase: 'lobby', round: {} };
    O = { role: 'host', code, base, links, me: { id: 0, name }, players: [], cfg: cfgNow(), n: 0, i: -1, round: {}, seq: 0, R };
    attach = L => {
      L.handlers.push((t, m) => { if (t === base + '/h' && m && m.from && m.m) hostOnData(L, m.from, m.m); });
      linkSub(L, base + '/h');
      linkPub(L, base + '/info', { t: 'room', ts: Date.now() }, { retain: true });
    };
    links.forEach(attach); ready = true;
    O.timer = setInterval(hostTick, HB_MS);
    S.view = 'lobby'; hostLobbyBroadcast();
  } finally { S.busy = false; }
}
/* ¿ya hay una sala con ese código? (los servidores guardan un aviso retenido) */
function roomExists(links, code) {
  return new Promise(res => {
    const topic = TOPIC_ROOT + code + '/info'; let found = false;
    const hs = links.map(L => { const h = (t, m) => { if (t === topic && m && m.t === 'room' && Date.now() - m.ts < 6 * 3600e3) found = true; }; L.handlers.push(h); linkSub(L, topic); return [L, h]; });
    setTimeout(() => { hs.forEach(([L, h]) => { L.handlers.splice(L.handlers.indexOf(h), 1); L.subs.splice(L.subs.indexOf(topic), 1); try { L.c.unsubscribe(topic); } catch (e) {} }); res(found); }, 1200);
  });
}
function hb(m) { // a todos (con número de secuencia para descartar repetidos)
  m.seq = ++O.seq;
  O.links.forEach(L => linkPub(L, O.base + '/all', { m }));
  onMsg(m);
}
function sendTo(pid, m) {
  if (pid === 0) return onMsg(m);
  const p = O.R.players.find(x => x.id === pid);
  if (p && p.alive && p.link) linkPub(p.link, O.base + '/u/' + p.uid, { m });
}
function hostLobbyBroadcast() { hb({ t: 'lobby', code: O.code, players: pub(O.R.players), cfg: cfgNow() }); }
function hostTick() {
  if (!O || O.role !== 'host') return;
  O.links.forEach(L => linkPub(L, O.base + '/all', { m: { t: 'hb' } }, { qos: 0 }));
  const now = Date.now();
  O.R.players.slice().forEach(p => { if (p.id !== 0 && p.alive && now - p.last > DEAD_MS) hostDrop(p); });
}
function hostOnData(L, uid, m) {
  if (!O || O.role !== 'host') return;
  const R = O.R; let p = R.players.find(x => x.uid === uid);
  if (m.t === 'join') {
    if (p) return; // el mismo jugador llega por varios servidores: se usa el primero
    const refuse = reason => linkPub(L, O.base + '/u/' + uid, { m: { t: 'err', reason } });
    if (R.started) return refuse('La partida ya empezó. Pedile al anfitrión que arme otra.');
    if (R.players.length >= MAXP) return refuse(`La sala está llena (${MAXP} jugadores).`);
    let name = String(m.name || '').trim().slice(0, 20) || `Jugador ${R.nextId + 1}`; const base = name; let k = 2;
    while (R.players.some(x => x.name.toLowerCase() === name.toLowerCase())) name = `${base} (${k++})`;
    p = { id: R.nextId++, name, alive: true, score: 0, correct: 0, wrong: 0, none: 0, uid, link: L, last: Date.now() };
    R.players.push(p);
    sendTo(p.id, { t: 'welcome', id: p.id, name });
    hostLobbyBroadcast();
    return;
  }
  if (!p || !p.alive) return;
  p.last = Date.now();
  if (m.t === 'a') hostAnswer(p.id, m.i);
  else if (m.t === 'bye') hostDrop(p);
}
function hostDrop(p) {
  if (!O || O.role !== 'host' || !p.alive) return;
  const R = O.R; p.alive = false;
  if (!R.started) { R.players = R.players.filter(x => x !== p); return hostLobbyBroadcast(); }
  hb({ t: 'plist', players: pub(R.players) });
  if (R.phase === 'q' && allAnswered()) hostReveal();
}
const allAnswered = () => O.R.players.every(p => !p.alive || O.R.round[p.id]);

function hostStart() {
  const R = O && O.R; if (!R || R.started || R.players.length < 2) return;
  const n = Math.min(settings.count, pool().length); if (!n) return toast('No hay preguntas con ese filtro');
  R.players.forEach(x => { x.score = 0; x.correct = 0; x.wrong = 0; x.none = 0; });
  R.started = true; R.qs = buildQs(n); R.i = -1; R.limit = settings.time;
  hb({ t: 'start', n, limit: R.limit, players: pub(R.players) });
  hostNextQ();
}
function hostNextQ() {
  const R = O && O.R; if (!R) return;
  clearTimeout(R.to); R.i++;
  if (R.i >= R.qs.length) return hostEnd();
  R.round = {}; R.phase = 'q'; R.t0 = Date.now();
  const q = R.qs[R.i];
  hb({ t: 'q', i: R.i, n: R.qs.length, cat: q.b.cat, diff: q.b.diff, text: q.b.q, opts: q.opts, limit: R.limit });
  R.to = setTimeout(hostReveal, R.limit * 1000 + 1500); // por si algún dispositivo no responde
  if (allAnswered()) hostReveal();
}
function hostAnswer(pid, i) {
  const R = O && O.R; if (!R || R.phase !== 'q' || R.round[pid]) return; // una sola respuesta por jugador y pregunta
  const p = R.players.find(x => x.id === pid); if (!p || !p.alive) return;
  const timeout = i === null || i === undefined;
  if (!timeout && !(Number.isInteger(i) && i >= 0 && i < 4)) return;
  const q = R.qs[R.i], ms = Math.min(R.limit * 1000, Date.now() - R.t0), rem = Math.max(0, R.limit - ms / 1000);
  const ok = !timeout && i === q.right, bonus = ok ? Math.round(50 * rem / R.limit) : 0, pts = ok ? 100 + bonus : 0;
  p.score += pts; if (ok) p.correct++; else { p.wrong++; if (timeout) p.none++; }
  R.round[pid] = { choice: i, ok, timeout, pts, bonus };
  sendTo(pid, { t: 'ack' });
  hb({ t: 'prog', answered: Object.keys(R.round).map(Number) });
  if (allAnswered()) hostReveal();
}
function hostReveal() {
  const R = O && O.R; if (!R || R.phase !== 'q') return;
  clearTimeout(R.to); R.phase = 'r';
  R.players.forEach(p => { if (!R.round[p.id]) { p.wrong++; p.none++; R.round[p.id] = { choice: null, ok: false, timeout: true, pts: 0, bonus: 0 }; } });
  const q = R.qs[R.i];
  hb({ t: 'r', i: R.i, right: q.right, exp: q.b.exp, results: R.players.map(p => Object.assign({ id: p.id, name: p.name }, R.round[p.id])), scores: pub(R.players), wait: REVEAL_SECS });
  R.to = setTimeout(hostNextQ, REVEAL_SECS * 1000);
}
function hostEnd() {
  const R = O.R; R.phase = 'end';
  hb({ t: 'end', n: R.qs.length, players: R.players.map(p => ({ id: p.id, name: p.name, score: p.score, correct: p.correct, wrong: p.wrong, alive: p.alive })) });
}
function hostBackToLobby() {
  const R = O && O.R; if (!R) return;
  clearTimeout(R.to); R.players = R.players.filter(p => p.alive); R.players.forEach(p => { p.score = 0; });
  R.started = false; R.phase = 'lobby'; S.view = 'lobby'; hostLobbyBroadcast();
}


/* ===== JUGADOR (cliente) ===== */
async function joinRoom(code, name) {
  if (O || S.busy) return;
  code = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) return setStatus('El código tiene 5 letras o números.', true);
  S.busy = true;
  const J = { uid: newUid(), base: TOPIC_ROOT + code, code, name, links: [], bound: null, finished: false, last: Date.now(), seen: new Set() };
  try {
    setStatus('Conectando con los servidores…');
    try { await loadMqttLib(); } catch (e) { return setStatus(NETFAIL, true); }
    let finish = () => {};
    const outcome = new Promise(res => { finish = res; });
    const onLink = L => {
      if (J.bound || J.finished) return linkEnd(L); // llegó tarde: ya hay una conexión elegida
      J.links.push(L);
      L.handlers.push((t, m) => clientOnLink(J, L, m, finish));
      linkSub(L, J.base + '/all'); linkSub(L, J.base + '/u/' + J.uid);
      linkPub(L, J.base + '/h', { from: J.uid, m: { t: 'join', name } }); // el servidor entrega el mensaje en orden: primero suscribe, después publica
    };
    await connectAll(onLink);
    if (!J.links.length) return setStatus(NETFAIL, true);
    setStatus('Buscando la sala…');
    const timer = setTimeout(() => finish('timeout'), 10000);
    const result = await outcome; clearTimeout(timer); J.finished = true;
    if (result !== 'ok') {
      J.links.forEach(linkEnd);
      return setStatus(result === 'timeout' ? `No se encontró la sala ${code}. Revisá el código y que el anfitrión tenga la sala abierta.` : result, true);
    }
  } finally { S.busy = false; }
}
function clientOnLink(J, L, m, finish) {
  if (!m || !m.m || J.finished && !O) return;
  const msg = m.m;
  if (!J.bound) { // todavía no sabemos por qué servidor nos atiende el anfitrión
    if (msg.t === 'welcome') {
      J.bound = L; J.links.filter(x => x !== L).forEach(linkEnd);
      O = { role: 'client', code: J.code, base: J.base, link: L, uid: J.uid, me: { id: msg.id, name: msg.name }, players: [], cfg: null, n: 0, i: -1, round: {}, J };
      O.timer = setInterval(() => {
        if (!O || O.role !== 'client') return;
        cSend({ t: 'ping' });
        if (Date.now() - J.last > DEAD_MS) hostLost();
      }, HB_MS);
      J.last = Date.now(); finish('ok');
    } else if (msg.t === 'err') finish(msg.reason);
    return;
  }
  if (L !== J.bound || !O) return;
  J.last = Date.now();
  if (msg.seq) { if (J.seen.has(msg.seq)) return; J.seen.add(msg.seq); }
  if (msg.t === 'hb') return;
  onMsg(msg);
}
const cSend = m => { if (O && O.role === 'client') linkPub(O.link, O.base + '/h', { from: O.uid, m }); };
function hostLost() {
  leaveRoom(); S.view = 'lost';
  render(`<div class="card handoff"><h2>La sala se cerró</h2><p class="muted">El anfitrión se desconectó o cerró la sala.</p>
    <button class="btn cy" data-act="go" data-to="rooms">${ic('users')}Volver a Multijugador</button></div>`);
}
function leaveRoom() {
  if (!O) return;
  const o = O; O = null; clearTimers(); clearInterval(o.timer);
  try {
    if (o.role === 'host') {
      clearTimeout(o.R.to);
      o.links.forEach(L => { linkPub(L, o.base + '/info', '', { retain: true }); linkPub(L, o.base + '/all', { m: { t: 'closed', seq: ++o.seq } }); });
      setTimeout(() => o.links.forEach(linkEnd), 400);
    } else {
      linkPub(o.link, o.base + '/h', { from: o.uid, m: { t: 'bye' } });
      setTimeout(() => linkEnd(o.link), 300);
    }
  } catch (e) {}
}

const ov = () => ({ players: O.players, round: O.round, i: O.i, qs: new Array(O.n).fill(0) });
function onMsg(m) {
  if (!O || !m) return;
  switch (m.t) {
    case 'welcome': O.me = { id: m.id, name: m.name }; break;
    case 'lobby':
      O.players = m.players; O.cfg = m.cfg; O.code = m.code || O.code;
      if (S.view !== 'oq' && S.view !== 'or') { const was = S.view === 'lobby' && $('#lobby-players'); S.view = 'lobby'; was ? updateLobby() : screens.lobby(); }
      break;
    case 'plist': O.players = m.players; if (S.view === 'oq') refreshBoard(); break;
    case 'closed': hostLost(); break;
    case 'err': { const r = m.reason; leaveRoom(); S.view = 'join'; screens.join(); setStatus(r, true); break; }
    case 'start': O.saved = false; O.n = m.n; O.i = -1; O.limit = m.limit; O.players = m.players; break;
    case 'q': renderOnlineQ(m); break;
    case 'prog': O.round = {}; m.answered.forEach(id => { O.round[id] = true; }); if (S.view === 'oq') { refreshBoard(); updateWait(); } break;

/* ---------- efectos ---------- */
function burst(el, n = 18) {
  if (!settings.anim || !el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), cols = ['#19F0D8', '#9B6BFF', '#3B7BFF', '#D5DDEE', '#42F5A8', '#C86BFF'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i'); d.className = 'spark';
    const a = Math.random() * Math.PI * 2, v = rand(60, 170);
    d.style.cssText = `color:${cols[i % 6]};left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;background:${cols[i % 6]};--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v - 40}px;--rot:${rand(-360, 360)}deg`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
  }
}

  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t;

  copylink: () => {
    const link = roomLink(O.code), inp = $('#rlink');
    const manual = () => { if (inp) { inp.focus(); inp.select(); } toast('Copiá el enlace seleccionado'); };
    try { navigator.clipboard.writeText(link).then(() => toast('Enlace copiado'), manual); } catch (e) { manual(); }
  },
  lstart: () => hostStart(),
  onext: () => { if (O && O.role === 'host' && O.R.phase === 'r') hostNextQ(); },
  lagain: () => hostBackToLobby(),
  leave: () => go('rooms'),
  ready: () => showQuestion(),
  next: () => { clearTimeout(S.to); nextQuestion(); },
  again: () => { const s = S.sess; newSession(s.mode, s.players.filter(p => !p.bot).map(p => p.name)); },
  switchmode: () => { const m = S.sess && S.sess.mode === 'solo' ? 'multi' : 'solo'; S.view = 'setup'; screens.setup(m); },
  bankcat: el => { S.bankCat = el.dataset.k; screens.bank(); },
  bankdiff: el => { S.bankDiff = el.dataset.v; screens.bank(); },
  rectab: el => { S.recTab = el.dataset.v; S.clearing = false; screens.records(); },
  recclear: () => {
    if (!S.clearing) { S.clearing = true; return screens.records(); }
    store.set('ci_rec_' + S.recTab, []); S.clearing = false; screens.records(); toast('Récords borrados');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.act !== 'pick') sfx.click();
  actions[el.dataset.act]?.(el);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || (document.activeElement && document.activeElement.tagName === 'INPUT')) return;
  if (S.view === 'oq') { const k = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()]; if (k !== undefined) oPick(k); return; }
  if (S.view !== 'q' || !S.sess || S.sess.locked) return;
  const m = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
  if (m !== undefined) pick(m);
});

applyAnim();
function checkHash() { // enlace de invitación: #sala-CODIGO
  const m = /^#sala-([A-Za-z0-9]{5})$/.exec(location.hash);
  if (!m || O || (S.sess && S.view !== 'home')) return false;
  S.view = 'join'; screens.join(m[1].toUpperCase()); return true;
}
addEventListener('hashchange', checkHash);
if (!checkHash()) screens.home();
})();

</script>
</body>
</html>
